<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${course.title}">Course Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <a th:href="@{/courses}" class="btn btn-secondary mb-3">&larr; Back to Courses</a>
    <div class="card shadow-sm p-4 mb-4">
        <h1 th:text="${course.title}" class="text-primary">Course Title</h1>
        <p class="text-muted" th:text="${course.description}">Course Description...</p>
        <p><strong>Instructor:</strong> <span th:text="${course.instructor != null ? course.instructor.username : 'N/A'}">Instructor Name</span></p>
    </div>

    <h3 class="mb-3">Course Modules</h3>
    <div class="list-group mb-4">
        <div class="list-group-item p-3" th:each="module : ${modules}">
            <h5 class="mb-1" th:text="${module.sequenceOrder + '. ' + module.title}">Module Title</h5>
            <p class="mb-1 text-secondary" th:text="${module.content}">Module content goes here...</p>
        </div>
        <div th:if="${#lists.isEmpty(modules)}" class="alert alert-info">No modules available for this course yet.</div>
    </div>
</div>
</body>
</html>
