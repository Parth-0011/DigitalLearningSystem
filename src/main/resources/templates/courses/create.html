<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Course</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm p-4">
        <h2 class="mb-4 text-center">Create New Course</h2>
        <form th:action="@{/courses}" th:object="${course}" method="post">
            <div class="mb-3">
                <label for="title" class="form-label">Course Title</label>
                <input type="text" id="title" th:field="*{title}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
            </div>
            <div class="mb-3">
                <label for="instructor" class="form-label">Instructor</label>
                <select id="instructor" th:field="*{instructor.id}" class="form-select" required>
                    <option value="">Select Instructor</option>
                    <option th:each="inst : ${instructors}" th:value="${inst.id}" th:text="${inst.username}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-success w-100">Save Course</button>
        </form>
        <div class="text-center mt-3">
            <a th:href="@{/courses}" class="text-decoration-none">Cancel</a>
        </div>
    </div>
</div>
</body>
</html>
