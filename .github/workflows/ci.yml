name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # 1. Spin up a MySQL service container for GitHub Actions
    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: parth500211
          MYSQL_DATABASE: dls
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      # 2. Set up JDK 25 using setup-java v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Run Maven build and tests
      - name: Build with Maven
        run: mvn clean test